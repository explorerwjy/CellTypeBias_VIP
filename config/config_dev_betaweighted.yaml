# ---------------------------------------------------------------------------
# Analysis type: only Centering (production default)
# ---------------------------------------------------------------------------
analysis_types:
  Centering: "dat/ExpMats/HumanCT.TPM.0.1.Filt.Spec.clip.lowexp.cut1e4.mean_centered.csv"

# Number of null simulations per set
n_random_weights: 10000

# Parallel processes (per global rules)
n_processes: 10

# ---------------------------------------------------------------------------
# Matching configurations: random + production matched (Best1000)
# ---------------------------------------------------------------------------
matching_configs:
  random:
    sampling_mode: "random"
    seed: 42

  matched:
    sampling_mode: "set_level_matched"
    set_level_matched_sampling:
      matching_variables: ["n_CDS_bases", "WB", "mean_phastCons"]
      use_propensity: false
      use_best_of_n: true
      n_candidates: 1000
      use_percentile: true
      max_distance: 0.15
      max_attempts: 1000
      use_ks_test: false
      ks_threshold: 0.3
      seed: 42

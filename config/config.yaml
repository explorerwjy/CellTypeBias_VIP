# Number of random weights (can customize per gene set if needed)
n_random_weights: 10000

# Number of parallel processes for gene weight generation (default: 10)
n_processes: 10

# ============================================================================
# MATCHING CONFIGURATIONS
# ============================================================================
# Define multiple matching strategies to run in parallel or individually.
# Each configuration will generate results in its own auto-generated directory.
#
# HOW TO USE:
# -----------
# 1. Single configuration: Keep only ONE config uncommented
#    → Snakemake will run all gene sets with that matching strategy
#
# 2. Multiple configurations: Uncomment MULTIPLE configs
#    → Snakemake will run all gene sets with ALL matching strategies in parallel
#    → Each config gets its own results directory
#    → Useful for comparing different matching approaches
#
# DIRECTORY NAMING:
# ----------------
# Output directories are auto-generated from parameters:
#   - phastCons_only → results/phastCons_only_mean_phastCons_Tricubic
#   - full_model → results/full_model_WB_mean_phastCons_n_CDS_bases_PropWeight_Tricubic
#
# EXAMPLES:
# ---------
# Example 1: Test gene-by-gene vs set-level matching
#   → Uncomment both 'phastCons_only' and 'full_model'
#   → Results will go to separate directories
#
# Example 2: Compare different variable combinations
#   → Create multiple set_level_matched configs with different matching_variables
#   → All will run in parallel with auto-generated directory names
# ============================================================================

matching_configs:

  # 1. Random sampling (unmatched control)
  random:
    sampling_mode: "random"
    seed: 42

  # 2. Best-of-N matched control (matches gene length, conservation, expression)
  matched:
    sampling_mode: "set_level_matched"
    set_level_matched_sampling:
      matching_variables: ["n_CDS_bases", "WB", "mean_phastCons"]
      use_propensity: false
      use_best_of_n: true
      n_candidates: 1000
      use_percentile: true
      max_distance: 0.15
      max_attempts: 1000
      use_ks_test: false
      ks_threshold: 0.3
      seed: 42

  # 3. Best-of-500 — sensitivity check (lower n_candidates)
  matched_500:
    sampling_mode: "set_level_matched"
    set_level_matched_sampling:
      matching_variables: ["n_CDS_bases", "WB", "mean_phastCons"]
      use_propensity: false
      use_best_of_n: true
      n_candidates: 500
      use_percentile: true
      max_distance: 0.15
      max_attempts: 1000
      use_ks_test: false
      ks_threshold: 0.3
      seed: 42

  # 4. Best-of-2000 — sensitivity check (higher n_candidates)
  matched_2000:
    sampling_mode: "set_level_matched"
    set_level_matched_sampling:
      matching_variables: ["n_CDS_bases", "WB", "mean_phastCons"]
      use_propensity: false
      use_best_of_n: true
      n_candidates: 2000
      use_percentile: true
      max_distance: 0.15
      max_attempts: 1000
      use_ks_test: false
      ks_threshold: 0.3
      seed: 42
